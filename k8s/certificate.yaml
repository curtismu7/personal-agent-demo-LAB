# TLS for the app's own host (a wildcard certificate covers one label only, so a host two levels down needs its own).
# cert-manager issues it through the ClusterIssuer the owner names (CLUSTER_ISSUER; DNS-01 on the SE cluster). No default.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: personal-agent-demo
spec:
  secretName: personal-agent-demo-tls
  dnsNames:
    - ${SE_HOST}
  issuerRef:
    kind: ClusterIssuer
    name: ${CLUSTER_ISSUER}
